# Desktop PulseAudio clients sometimes request node.dont-reconnect=true. When a
# card profile is changed, that leaves their stream tied to a node that no
# longer exists and even pavucontrol cannot move it. Native PipeWire/Pro Audio
# clients are intentionally outside this rule.
stream.rules = [
    {
        matches = [
            { media.class = "~Stream/(Output|Input)/Audio" }
        ]
        actions = {
            update-props = {
                node.dont-reconnect = false
            }
        }
    }
]
