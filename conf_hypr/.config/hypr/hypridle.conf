# Todo bloqueio passa pelo ~/.config/hypr/scripts/system-lock.sh (qylock com
# supervisão). Não usar `omarchy-system-lock`: ele vive na árvore git do Omarchy
# e volta pro hyprlock a cada `omarchy update`.
general {
    lock_cmd = ~/.config/hypr/scripts/system-lock.sh                      # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true ~/.config/hypr/scripts/system-lock.sh  # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && ~/.config/hypr/scripts/system-wake.sh    # delay for PAM readiness, then restore backlight.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after (X) seconds
#
# O colchete em "[l]ock_shell.qml" NÃO é enfeite — sem ele o screensaver nunca
# sobe. O hypridle executa o on-timeout via `sh -c "<comando inteiro>"`, então a
# string "lock_shell.qml" passa a fazer parte da linha de comando desse próprio
# sh. O `pgrep -f` varre linha de comando, encontra o sh que o está executando,
# retorna 0, e o `||` curto-circuita antes de chegar no screensaver — o guard
# "já tem lock na tela?" dá positivo mesmo com a tela destravada.
#
# Como regex, [l]ock_shell.qml casa com "lock_shell.qml" (o processo de verdade)
# mas não com o literal "[l]ock_shell.qml" que aparece na cmdline do sh.
#
# Note que o system-lock.sh usa `pgrep -f "lock_shell.qml"` sem colchete e está
# certo: lá a string mora dentro do arquivo do script, não na cmdline.
listener {
    timeout = 90
    on-timeout = pgrep -f "[l]ock_shell.qml" || pidof hyprlock || omarchy-launch-screensaver
}

# Lock system after (X) seconds (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = ~/.config/hypr/scripts/system-lock.sh
    on-resume = ~/.config/hypr/scripts/system-wake.sh
}
