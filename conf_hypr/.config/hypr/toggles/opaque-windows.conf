# Window transparency toggle flag.
#
# Present in ~/.local/state/omarchy/toggles/hypr/ -> windows are fully opaque.
# Absent                                          -> the opacities set in
#                                                    looknfeel.conf apply.
#
# hyprland.conf sources the toggles directory after looknfeel.conf, so these
# values win while the flag is installed. Managed by scripts/toggle-transparency.sh
# — this file is the template, don't edit the copy in ~/.local/state.

decoration {
    active_opacity = 1.0
    inactive_opacity = 1.0
}
