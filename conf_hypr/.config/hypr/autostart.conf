# Personal autostart — runs alongside Omarchy's default autostart.
# Omarchy already starts hypridle, swaybg, polkit, mako, waybar, etc.

# Dynamic wallpaper daemon (awww replaces Omarchy's swaybg for this session)
exec-once = awww-daemon

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Brain_Shell + Quickshell overlay are now managed by systemd --user units
# (brainshell.service, quickshell.service), enabled on graphical-session.target
# with Restart=always so they self-heal after monitor/DPMS/suspend churn.
# See ~/.config/systemd/user/{brainshell,quickshell}.service.
#   Start/stop:  systemctl --user {start,stop,restart} brainshell.service
#   Logs:        journalctl --user -u brainshell.service -f

# Random wallpaper on reload
exec-once = ~/.config/hypr/scripts/random-paper-hypr.sh

# Disable fcitx5 (IME prediction popup), started by Omarchy.
# O mako é morto pelo qs_run.sh, que insiste por alguns segundos — não repetir aqui.
exec-once = sleep 2 && killall fcitx5
