# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Logitech MX Keys
# bind = SUPER SHIFT, S, exec, omarchy-capture-screenshot      # Print Screen Button
# bind = SUPER, H, exec, voxtype record toggle                 # Dictation Button
# bind = SUPER, PERIOD, exec, omarchy-launch-walker -m symbols # Emoji Button

# Brain_Shell Clipboard override
unbind = SUPER CTRL, V
bindd = SUPER CTRL, V, Brain_Shell Clipboard, exec, bash -c 'qs -p ~/.config/Brain_Shell ipc call clipboard-toggle toggle'

# Brain_Shell Emoji picker (replaces the walker symbols launcher)
bindd = SUPER, PERIOD, Brain_Shell Emoji, exec, bash -c 'qs -p ~/.config/Brain_Shell ipc call emoji-toggle toggle'

# Window transparency flag (persists across reloads and reboots)
bindd = SUPER ALT, T, Toggle window transparency, exec, ~/.config/hypr/scripts/toggle-transparency.sh

# Screenshot straight into the editor (same action as the bar module)
bindd = SUPER ALT, P, Screenshot and edit, exec, ~/.config/hypr/scripts/screenshot-edit.sh smart

# Brain_Shell audio is the single authority for physical endpoints. Omarchy's
# stock bindings target @DEFAULT_AUDIO_SINK@ and its output switch includes the
# virtual EasyEffects sink, so override them after the stock media.conf source.
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
unbind = , XF86AudioMicMute
unbind = ALT, XF86AudioRaiseVolume
unbind = ALT, XF86AudioLowerVolume
unbind = SUPER, XF86AudioMute
bindeld = , XF86AudioRaiseVolume, Volume up (physical output), exec, ~/.config/Brain_Shell/src/scripts/audio-control.sh key-volume raise
bindeld = , XF86AudioLowerVolume, Volume down (physical output), exec, ~/.config/Brain_Shell/src/scripts/audio-control.sh key-volume lower
bindeld = , XF86AudioMute, Mute physical output, exec, ~/.config/Brain_Shell/src/scripts/audio-control.sh key-volume mute-toggle
bindeld = , XF86AudioMicMute, Mute physical microphone, exec, ~/.config/Brain_Shell/src/scripts/audio-control.sh key-input-mute
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise (physical output), exec, ~/.config/Brain_Shell/src/scripts/audio-control.sh key-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise (physical output), exec, ~/.config/Brain_Shell/src/scripts/audio-control.sh key-volume -1
bindld = SUPER, XF86AudioMute, Switch physical audio output, exec, ~/.config/Brain_Shell/src/scripts/audio-control.sh next-output

# SUPER+CTRL+A used to open wiremix. It now opens the same clear audio panel as
# the bar; pavucontrol remains available from the Advanced tab.
unbind = SUPER CTRL, A
bindd = SUPER CTRL, A, Brain_Shell audio controls, exec, qs -p ~/.config/Brain_Shell ipc call audioOut-toggle toggle

# QyLock screen override
unbind = SUPER CTRL, L
bindd = SUPER CTRL, L, Lock system, exec, ~/.config/hypr/scripts/system-lock.sh
source = ~/.config/Brain_Shell/Brain_ShellKeybinds.conf
