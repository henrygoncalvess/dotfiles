# A unit de autostart do EasyEffects é gerada pelo systemd-xdg-autostart-generator
# a partir de ~/.config/autostart/com.github.wwmm.easyeffects.desktop, e vem sem
# nenhuma politica de restart. Em 29/07/2026 ela morreu 8min apos o login com
#   wl_display#1: error 0: invalid object 34
#   The Wayland connection experienced a fatal error: Invalid argument
# (exit 255) e ficou morta — sem o EE no caminho, o equalizador simplesmente some
# ate alguem subir o processo na mao.
[Service]
Restart=on-failure
RestartSec=3
